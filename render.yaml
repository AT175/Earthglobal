# Render Blueprint — EarthGlobal Land Monitoring App
# Deploy via: render deploy (CLI) or connect this repo in the Render dashboard
# and select "Blueprint" → render.yaml will be auto-detected.
# Docs: https://render.com/docs/blueprint-spec
#
# DATABASE: This app uses a SHARED PostgreSQL database that already contains
# another application's schema. EarthGlobal tables are isolated in a dedicated
# "earthglobal" PostgreSQL schema (see schema.sql). Set DATABASE_URL manually
# in the Render dashboard for each service that needs DB access.

services:
  # ─────────────────────────────────────────────────────────────
  # Backend API + WebSocket server
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: earthglobal-api
    region: oregon
    plan: starter
    runtime: node
    rootDir: landguard-app-scaffold/land-monitor-app/backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # set manually — your existing shared Postgres connection string
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://earthglobal-owner.onrender.com,https://earthglobal-agent.onrender.com,https://earthglobal-admin.onrender.com"
      - key: PORT
        value: "10000"
      # Optional integrations — set these in the Render dashboard after first deploy:
      # - key: GOOGLE_MAPS_API_KEY
      # - key: SENTINEL_HUB_CLIENT_ID
      # - key: SENTINEL_HUB_CLIENT_SECRET
      # Google Earth Engine — paste the full service account JSON key here
      # (download from Google Cloud Console → IAM → Service Accounts → Keys)
      - key: EE_SERVICE_ACCOUNT_JSON
        sync: false  # set manually — the JSON key file contents
      # - key: S3_BUCKET / S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY / S3_ENDPOINT
      # - key: STRIPE_SECRET_KEY
      # - key: SENDGRID_API_KEY / TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN

  # ─────────────────────────────────────────────────────────────
  # Database migration — runs schema.sql (creates the "earthglobal" schema
  # and all tables inside it). Safe to re-run — uses IF NOT EXISTS + DO blocks.
  # ─────────────────────────────────────────────────────────────
  - type: job
    name: earthglobal-migrate
    region: oregon
    plan: starter
    runtime: node
    rootDir: landguard-app-scaffold/land-monitor-app/backend
    buildCommand: npm install
    startCommand: node scripts/migrate.js
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually — same shared Postgres connection string
      - key: DATABASE_SSL
        value: "true"

  # ─────────────────────────────────────────────────────────────
  # Frontend — Owner app (static site)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: earthglobal-owner
    region: oregon
    plan: starter
    runtime: static
    rootDir: landguard-app-scaffold/land-monitor-app/frontend-owner
    buildCommand: cd ../design-system && npm install && cd ../frontend-owner && npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://earthglobal-api.onrender.com"
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        value: "sb_publishable_L4s9Yu3IfhPcXm6xCW6T2Q_aJHSG-4Y"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false  # set manually in Render dashboard
    routes:
      - pattern: /*
        source: /
        destination: /index.html

  # ─────────────────────────────────────────────────────────────
  # Frontend — Agent app (static site)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: earthglobal-agent
    region: oregon
    plan: starter
    runtime: static
    rootDir: landguard-app-scaffold/land-monitor-app/frontend-agent
    buildCommand: cd ../design-system && npm install && cd ../frontend-agent && npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://earthglobal-api.onrender.com"
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        value: "sb_publishable_L4s9Yu3IfhPcXm6xCW6T2Q_aJHSG-4Y"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - pattern: /*
        source: /
        destination: /index.html

  # ─────────────────────────────────────────────────────────────
  # Frontend — Admin app (static site)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: earthglobal-admin
    region: oregon
    plan: starter
    runtime: static
    rootDir: landguard-app-scaffold/land-monitor-app/frontend-admin
    buildCommand: cd ../design-system && npm install && cd ../frontend-admin && npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://earthglobal-api.onrender.com"
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        value: "sb_publishable_L4s9Yu3IfhPcXm6xCW6T2Q_aJHSG-4Y"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - pattern: /*
        source: /
        destination: /index.html
