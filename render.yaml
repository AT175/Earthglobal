# Render Blueprint — EarthGlobal Land Monitoring App
# Deploy via: render deploy (CLI) or connect this repo in the Render dashboard
# and select "Blueprint" → render.yaml will be auto-detected.
# Docs: https://render.com/docs/blueprint-spec
#
# DATABASE: This app uses a SHARED PostgreSQL database that already contains
# another application's schema. EarthGlobal tables are isolated in a dedicated
# "earthglobal" PostgreSQL schema (see schema.sql). Set DATABASE_URL manually
# in the Render dashboard for each service that needs DB access.

services:
  # ─────────────────────────────────────────────────────────────
  # Backend API + WebSocket server
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: earthglobal-api
    region: oregon
    plan: starter
    runtime: node
    buildCommand: yarn build
    startCommand: yarn start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # set manually — your existing shared Postgres connection string
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://earthglobalgh.netlify.app,https://earthglobal.onrender.com"
      - key: PORT
        value: "10000"
      # Stripe payments
      - key: STRIPE_SECRET_KEY
        sync: false  # set manually — sk_test_xxx or sk_live_xxx
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # set manually — whsec_xxx
      # Google Earth Engine — paste the full service account JSON key here
      - key: EE_SERVICE_ACCOUNT_JSON
        sync: false  # set manually — the JSON key file contents
      # Storage (S3/R2)
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      # Notifications
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

  # ─────────────────────────────────────────────────────────────
  # Database migration — runs schema.sql (creates the "earthglobal" schema
  # and all tables inside it). Safe to re-run — uses IF NOT EXISTS + DO blocks.
  # ─────────────────────────────────────────────────────────────
  - type: job
    name: earthglobal-migrate
    region: oregon
    plan: starter
    runtime: node
    buildCommand: yarn build
    startCommand: yarn migrate
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually — same shared Postgres connection string
      - key: DATABASE_SSL
        value: "true"

  # ─────────────────────────────────────────────────────────────
  # Frontend — Unified app (owner + agent + admin in one)
  # Deployed to Netlify as earthglobalgh.netlify.app
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: earthglobal-app
    region: oregon
    plan: starter
    runtime: static
    rootDir: landguard-app-scaffold/land-monitor-app/frontend-owner
    buildCommand: cd ../design-system && npm install && cd ../frontend-owner && npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://earthglobal.onrender.com"
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        value: "sb_publishable_L4s9Yu3IfhPcXm6xCW6T2Q_aJHSG-4Y"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false  # set manually in Render dashboard
    routes:
      - pattern: /*
        source: /
        destination: /index.html
