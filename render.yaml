# Render Blueprint — EarthGlobal Land Monitoring App
# Deploy via: render deploy (CLI) or connect this repo in the Render dashboard
# and select "Blueprint" → render.yaml will be auto-detected.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL database with PostGIS
  # ─────────────────────────────────────────────────────────────
  - type: pserv
    name: earthglobal-db
    region: oregon
    plan: starter
    ipAllowList: []  # allow connections from Render services only
    envVars:
      - key: POSTGRES_EXTENSIONS
        value: postgis,uuid-ossp

  # ─────────────────────────────────────────────────────────────
  # Backend API + WebSocket server
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: earthglobal-api
    region: oregon
    plan: starter
    runtime: node
    rootDir: landguard-app-scaffold/land-monitor-app/backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: earthglobal-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # Comma-separated list of frontend origins once they're deployed
        value: "https://earthglobal-owner.onrender.com,https://earthglobal-agent.onrender.com,https://earthglobal-admin.onrender.com"
      - key: PORT
        value: "10000"
      # Optional integrations — set these in the Render dashboard after first deploy:
      # - key: GOOGLE_MAPS_API_KEY
      # - key: SENTINEL_HUB_CLIENT_ID
      # - key: SENTINEL_HUB_CLIENT_SECRET
      # - key: S3_BUCKET
      # - key: S3_ACCESS_KEY_ID
      # - key: S3_SECRET_ACCESS_KEY
      # - key: S3_ENDPOINT
      # - key: STRIPE_SECRET_KEY
      # - key: SENDGRID_API_KEY
      # - key: TWILIO_ACCOUNT_SID
      # - key: TWILIO_AUTH_TOKEN

  # ─────────────────────────────────────────────────────────────
  # Database migration — runs schema.sql after the API is live.
  # This is a one-shot job triggered on each deploy.
  # ─────────────────────────────────────────────────────────────
  - type: job
    name: earthglobal-migrate
    region: oregon
    plan: starter
    runtime: node
    rootDir: landguard-app-scaffold/land-monitor-app/backend
    buildCommand: npm install
    startCommand: node scripts/migrate.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: earthglobal-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

  # ─────────────────────────────────────────────────────────────
  # Frontend — Owner app (static site)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: earthglobal-owner
    region: oregon
    plan: starter
    runtime: static
    rootDir: landguard-app-scaffold/land-monitor-app/frontend-owner
    buildCommand: cd ../design-system && npm install && cd ../frontend-owner && npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://earthglobal-api.onrender.com"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false  # set manually in Render dashboard
    routes:
      - pattern: /*
        source: /
        destination: /index.html

  # ─────────────────────────────────────────────────────────────
  # Frontend — Agent app (static site)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: earthglobal-agent
    region: oregon
    plan: starter
    runtime: static
    rootDir: landguard-app-scaffold/land-monitor-app/frontend-agent
    buildCommand: cd ../design-system && npm install && cd ../frontend-agent && npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://earthglobal-api.onrender.com"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - pattern: /*
        source: /
        destination: /index.html

  # ─────────────────────────────────────────────────────────────
  # Frontend — Admin app (static site)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: earthglobal-admin
    region: oregon
    plan: starter
    runtime: static
    rootDir: landguard-app-scaffold/land-monitor-app/frontend-admin
    buildCommand: cd ../design-system && npm install && cd ../frontend-admin && npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: "https://earthglobal-api.onrender.com"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - pattern: /*
        source: /
        destination: /index.html
